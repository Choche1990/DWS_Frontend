<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control de accesos | Digital Workspace</title>
<style>body{font:15px system-ui;margin:32px;color:#173629;background:#f7faf9}main{max-width:1100px;margin:auto}table{border-collapse:collapse;width:100%;background:white}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:left}a{color:#007b45}button{padding:8px 16px;cursor:pointer}#summary{padding:20px;background:#e9f5ef;border-radius:10px;line-height:1.8}.scroll{overflow:auto}</style></head>
<body><main><h1>Control de accesos</h1><a href="/">Volver a la plataforma</a> <button id="refresh">Actualizar</button><p id="summary" role="status">Cargando?</p><p>Conteos acumulados. Cada apertura o recarga del Gantt cuenta como una visita. Los usuarios distintos se cuentan por correo.</p><div class="scroll"><table><thead><tr><th>Fecha y hora local</th><th>Evento</th><th>Usuario</th></tr></thead><tbody id="events"></tbody></table></div></main><script src="/session-client.js"></script><script>
const labels={LOGIN_SUCCESS:'Ingreso correcto',LOGIN_FAILED:'Intento fallido',LOGOUT:'Cierre de sesi?n',SESSION_EXPIRED:'Sesi?n vencida',GANTT_ENTER:'Entrada al Gantt'};
async function refresh(){const summary=document.getElementById('summary');try{const r=await fetch('/api/access-history');if(!r.ok){summary.textContent=r.status===403?'Solo los administradores pueden consultar este registro.':'No se pudo consultar el registro.';return;}const d=await r.json();summary.textContent='Ingresos correctos: '+d.summary.successfulLogins+' ? Intentos fallidos: '+d.summary.failedLogins+' ? Visitas al Gantt: '+d.summary.ganttVisits+' ? Usuarios distintos en Gantt: '+d.summary.ganttUsers;const rows=document.getElementById('events');rows.replaceChildren();for(const e of d.events.reverse()){const tr=document.createElement('tr');for(const text of [new Date(e.timestamp).toLocaleString(),labels[e.event]||e.event,e.name?e.name+' ('+e.email+')':e.email]){const td=document.createElement('td');td.textContent=text;tr.append(td);}rows.append(tr);}}catch(_){summary.textContent='No se pudo conectar con el servidor. Vuelve a intentar.'}}
document.getElementById('refresh').addEventListener('click',refresh);dwsSessionReady.then(refresh);
</script></body></html>
