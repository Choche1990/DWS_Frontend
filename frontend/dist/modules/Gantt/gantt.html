<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bundled Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fff; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading,
    #__bundler_thumbnail { display: none; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_thumbnail">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#05BE50"></rect>
    <rect x="360" y="250" width="120" height="120" rx="26" fill="#fff"></rect>
    <rect x="540" y="250" width="120" height="120" rx="26" fill="#005F1E"></rect>
    <rect x="360" y="430" width="120" height="120" rx="26" fill="#005F1E"></rect>
    <rect x="540" y="430" width="120" height="120" rx="26" fill="#fff"></rect>
    <text x="720" y="425" font-family="Poppins,system-ui,sans-serif" font-size="72" font-weight="700" fill="#fff">Backlog</text>
    <text x="720" y="500" font-family="Poppins,system-ui,sans-serif" font-size="44" font-weight="500" fill="#C9F6D8">DataLab</text>
  </svg>
</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);
    // La primera visualizacion debe mostrar todos los estados.
    template = template.replace(
      "view: 'gantt', fEstado: ['En proceso'], fAsignado: [], fPeriodo: []",
      "view: 'dashboard', fEstado: [], fAsignado: [], fPeriodo: []"
    );
    // El indicador de hoy debe seguir la fecha real, no la fecha fija del artefacto.
    template = template.replace(
      "this._today = Date.parse(this.props.fechaHoy || '2026-07-31');",
      "this._today = Date.now();"
    );
    template = template.replace(
      "const tg = geoIn(this.props.fechaHoy||'2026-07-31', this.props.fechaHoy||'2026-07-31');",
      "const now = new Date(); const todayIso = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0'); const tg = geoIn(todayIso, todayIso);"
    );
    // Los dialogos deben quedar por encima de los menus desplegables.
    template = template.replaceAll('z-index:40', 'z-index:60');
    template = template.replaceAll('z-index:41', 'z-index:61');
    // Crear un proyecto lo deja editable en la tabla, sin abrir el panel de tareas.
    template = template.replace(
      "return { projects, nextId, view:'tabla', openId:id };",
      "return { projects, nextId, view:'tabla', openId:null, openFilter:null, colMenuOpen:false, groupMenuOpen:false, addColumnMenuOpen:false };"
    );
    // Al abrir tareas desde una fila, cerrar cualquier menu que pudiera superponerse.
    template = template.replace(
      "open:()=>this.setState({ openId:p.id }),",
      "open:()=>this.setState({ openId:p.id, openFilter:null, colMenuOpen:false, groupMenuOpen:false }),"
    );
    template = template.replace(
      "open:()=>this.setState({ openId:r.id }),",
      "open:()=>this.setState({ openId:r.id, openFilter:null, colMenuOpen:false, groupMenuOpen:false }),"
    );
    // Ajustes responsivos para laptops y tarjetas de tareas estrechas.
    template = template.replace(
      '<button class="ib-tab" style="{{ tabTablaStyle }}" sc-camel-on-click="{{ goTabla }}">Tabla',
      '<button class="ib-tab" style="{{ tabTablaStyle }}" sc-camel-on-click="{{ goTabla }}">Proyectos'
    );
    template = template.replace(
      '<button class="ib-tab" style="{{ tabTablaStyle }}" sc-camel-on-click="{{ goTabla }}">Proyectos<span style="{{ tablaUnderline }}"></span></button>\n      <button class="ib-tab" style="{{ tabGanttStyle }}" sc-camel-on-click="{{ goGantt }}">Gantt<span style="{{ ganttUnderline }}"></span></button>\n      <button class="ib-tab" style="{{ tabDashStyle }}" sc-camel-on-click="{{ goDash }}">Dashboard<span style="{{ dashUnderline }}"></span></button>\n      <button class="ib-tab" style="{{ tabDetalleStyle }}" sc-camel-on-click="{{ goDetalle }}">Detalle<span style="{{ detalleUnderline }}"></span></button>\n      <button class="ib-tab" style="{{ tabTareasStyle }}" sc-camel-on-click="{{ goTareas }}">Tareas<span style="{{ tareasUnderline }}"></span></button>',
      '<button class="ib-tab" style="{{ tabDashStyle }}" sc-camel-on-click="{{ goDash }}">Dashboard<span style="{{ dashUnderline }}"></span></button>\n      <button class="ib-tab" style="{{ tabTablaStyle }}" sc-camel-on-click="{{ goTabla }}">Proyectos<span style="{{ tablaUnderline }}"></span></button>\n      <button class="ib-tab" style="{{ tabGanttStyle }}" sc-camel-on-click="{{ goGantt }}">Gantt<span style="{{ ganttUnderline }}"></span></button>\n      <button class="ib-tab" style="{{ tabDetalleStyle }}" sc-camel-on-click="{{ goDetalle }}">Detalle<span style="{{ detalleUnderline }}"></span></button>\n      <button class="ib-tab" style="{{ tabTareasStyle }}" sc-camel-on-click="{{ goTareas }}">Tareas<span style="{{ tareasUnderline }}"></span></button>'
    );
    template = template.replace(
      'display:flex;align-items:center;gap:20px;padding:0 24px;background:#fff;border-bottom:1px solid #E6EAEE',
      'display:flex;align-items:center;gap:12px;padding:0 clamp(12px,2vw,24px);background:#fff;border-bottom:1px solid #E6EAEE;flex-wrap:wrap;min-width:0'
    );
    template = template.replace(
      'display:flex;gap:22px',
      'display:flex;gap:18px;overflow-x:auto;min-width:0;max-width:100%'
    );
    template = template.replace(
      'display:flex;align-items:center;gap:10px;padding:8px 0',
      'display:flex;align-items:center;gap:8px;padding:8px 0;flex-wrap:wrap;min-width:0;max-width:100%'
    );
    template = template.replace(
      "filtersStyle: 'display:flex;align-items:center;gap:10px'",
      "filtersStyle: 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;max-width:100%'"
    );
    template = template.replace(
      '<main style="flex:1;padding:22px 24px 40px">',
      '<main style="flex:1;padding:18px clamp(12px,2vw,24px) 32px;min-width:0;max-width:100%">'
    );
    template = template.replace(
      'min-width:270px;max-width:270px;flex:none;background:#F4F6F8',
      'width:clamp(240px,28vw,270px);min-width:240px;max-width:270px;flex:none;background:#F4F6F8;overflow:hidden'
    );
    template = template.replaceAll(
      'class="ib-sel" style="flex:1;font-size:11px"',
      'class="ib-sel" style="flex:1;min-width:0;width:0;font-size:11px"'
    );
    template = template.replaceAll(
      'class="ib-cell" style="flex:1;font-size:11px"',
      'class="ib-cell" style="flex:1;min-width:0;width:0;font-size:11px"'
    );

    // La ficha abre con el contexto del proyecto y permite gestionar stakeholders y presupuesto.
    const detailMetricsAnchor = '      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">';
    const projectContextBlock = `      <div style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px">
        <div style="grid-column:span 6;min-height:220px;background:#fff;border:1px solid #E6EAEE;border-radius:16px;padding:20px 22px;box-shadow:0 4px 20px rgba(0,0,0,.04)">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px"><div><div style="font-size:14px;font-weight:600">Objetivo</div><div style="font-size:10.5px;color:#8A95A1;margin-top:2px">Resultado central que busca alcanzar el proyecto</div></div><button sc-camel-on-click="{{ sel.openObjectives }}" title="Abrir seguimiento de objetivos" style="border:1px solid #B9E5C9;background:#E3F7EC;color:#00792F;border-radius:999px;padding:5px 9px;font-size:9.5px;font-weight:800;cursor:pointer;white-space:nowrap">Seguimiento</button></div>
          <textarea rows="6" maxlength="500" style="width:100%;min-height:128px;resize:vertical;border:1px solid #DCE6E0;background:#FBFDFC;border-radius:11px;padding:12px 14px;font-size:13px;line-height:1.55;font-family:inherit;color:#1B2733" placeholder="Describe el resultado principal que debe alcanzar el proyecto" value="{{ sel.objetivo }}" sc-camel-on-input="{{ sel.onObjetivo }}"></textarea>
          <div style="display:flex;justify-content:space-between;gap:8px;margin-top:5px"><span style="font-size:10px;color:#8A95A1">Los objetivos evaluables se administran en Seguimiento.</span><span style="font-size:10.5px;color:#A0AAB4">{{ sel.objLen }}/{{ sel.contextMax }}</span></div>
        </div>
        <div style="grid-column:span 6;min-height:220px;background:#fff;border:1px solid #E6EAEE;border-radius:16px;padding:20px 22px;box-shadow:0 4px 20px rgba(0,0,0,.04)">
          <div style="font-size:14px;font-weight:600;margin-bottom:8px">Alcance</div>
          <textarea rows="4" maxlength="500" style="width:100%;resize:vertical;border:1px solid #E6EAEE;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5;font-family:inherit;color:#1B2733" placeholder="Incluye entregables, límites y áreas impactadas" value="{{ sel.alcance }}" sc-camel-on-input="{{ sel.onAlcance }}"></textarea>
          <div style="text-align:right;font-size:10.5px;color:#A0AAB4;margin-top:3px">{{ sel.alcanceLen }}/{{ sel.contextMax }}</div>
        </div>
        <div style="grid-column:span 8;min-height:170px;background:#fff;border:1px solid #E6EAEE;border-radius:16px;padding:20px 22px;box-shadow:0 4px 20px rgba(0,0,0,.04)">
          <div style="font-size:14px;font-weight:600;margin-bottom:8px">Descripción del proyecto</div>
          <textarea rows="4" maxlength="500" style="width:100%;resize:vertical;border:1px solid #E6EAEE;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5;font-family:inherit;color:#1B2733" placeholder="Resume el contexto y la necesidad del proyecto" value="{{ sel.descripcionEjecutiva }}" sc-camel-on-input="{{ sel.onDescripcionEjecutiva }}"></textarea>
          <div style="text-align:right;font-size:10.5px;color:#A0AAB4;margin-top:3px">{{ sel.descLen }}/{{ sel.contextMax }}</div>
        </div>
        <div style="grid-column:span 4;min-height:170px;background:#fff;border:1px solid #E6EAEE;border-radius:16px;padding:20px 22px;box-shadow:0 4px 20px rgba(0,0,0,.04)">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><div style="font-size:14px;font-weight:600">Presupuesto</div><label style="display:flex;align-items:center;gap:4px;font-size:10px;color:#8A95A1;cursor:pointer"><input type="checkbox" checked="{{ sel.presupuestoNA }}" sc-camel-on-change="{{ sel.onTogglePresupuestoNA }}"> No aplica</label></div>
          <sc-if value="{{ sel.presupuestoNA }}" hint-placeholder-val="{{ false }}"><div style="font-size:17px;font-weight:700;color:#B4BEC8;margin-top:25px">No aplica</div></sc-if>
          <sc-if value="{{ sel.presupuestoActivo }}" hint-placeholder-val="{{ true }}"><div style="display:flex;gap:5px;margin-top:13px"><button sc-camel-on-click="{{ sel.onPresupuestoSol }}" style="{{ sel.presupuestoSolStyle }};border:1px solid #E6EAEE;border-radius:7px;padding:3px 8px;font-size:10.5px;font-weight:600;cursor:pointer">S/ Soles</button><button sc-camel-on-click="{{ sel.onPresupuestoDolar }}" style="{{ sel.presupuestoDolarStyle }};border:1px solid #E6EAEE;border-radius:7px;padding:3px 8px;font-size:10.5px;font-weight:600;cursor:pointer">$ Dólares</button></div><div style="display:flex;align-items:center;gap:7px;margin-top:10px"><span style="font-size:17px;font-weight:700;color:#00792F">{{ sel.presupuestoSimbolo }}</span><input class="ib-cell ib-numsm" type="number" min="0" step="0.01" style="font-size:18px;font-weight:700;width:100%" placeholder="0.00" value="{{ sel.presupuestoMonto }}" sc-camel-on-change="{{ sel.onPresupuestoMonto }}"></div></sc-if>
        </div>
      </div>

      <div style="display:block">
        <div style="background:#fff;border:1px solid #E6EAEE;border-radius:16px;padding:20px 22px;box-shadow:0 4px 20px rgba(0,0,0,.04)">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px">
            <div><div style="font-size:14px;font-weight:600">Roles y responsabilidades</div><div style="font-size:11px;color:#8A95A1;margin-top:2px">Stakeholders internos y externos del proyecto</div></div>
            <button sc-camel-on-click="{{ sel.addStakeholder }}" style="background:#05BE50;color:#062B14;border:none;border-radius:999px;padding:7px 13px;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap">+ Agregar persona</button>
          </div>
          <div style="max-height:310px;overflow-y:auto;padding-right:3px">
          <sc-if value="{{ sel.hasStakeholders }}" hint-placeholder-val="{{ true }}">
            <div style="display:grid;grid-template-columns:1.05fr .8fr .85fr 1fr 1.8fr 30px;gap:8px;padding:0 6px 7px;font-size:10px;font-weight:600;color:#8A95A1;text-transform:uppercase"><span>Persona</span><span>Rol</span><span>Pertenece a</span><span>Empresa</span><span>Actividades</span><span></span></div>
            <sc-for list="{{ sel.stakeholderRows }}" as="sh" hint-placeholder-count="2">
              <div style="display:grid;grid-template-columns:1.05fr .8fr .85fr 1fr 1.8fr 30px;gap:8px;align-items:start;padding:9px 6px;border-top:1px solid #F0F2F4">
                <sc-raw-select class="ib-sel" style="min-width:0;font-size:12px" value="{{ sh.persona }}" sc-camel-on-change="{{ sh.onPersona }}"><option value="">Seleccionar usuario</option><sc-for list="{{ teamNames }}" as="tn" hint-placeholder-count="6"><option value="{{ tn }}">{{ tn }}</option></sc-for></sc-raw-select>
                <input class="ib-cell" style="min-width:0;font-size:12px" placeholder="Ej. Sponsor, líder" value="{{ sh.rol }}" sc-camel-on-change="{{ sh.onRol }}">
                <div style="display:grid;grid-template-columns:1fr 1fr;background:#F1F3F5;border-radius:8px;padding:2px;gap:2px"><button sc-camel-on-click="{{ sh.onInterbank }}" style="{{ sh.ibkChoiceStyle }}">IBK</button><button sc-camel-on-click="{{ sh.onExterno }}" style="{{ sh.extChoiceStyle }}">Externa</button></div>
                <sc-if value="{{ sh.esInterbank }}" hint-placeholder-val="{{ true }}"><span style="display:inline-flex;align-items:center;justify-content:center;background:#E3F7EC;color:#00792F;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:600">Interbank</span></sc-if><sc-if value="{{ sh.esExterno }}" hint-placeholder-val="{{ false }}"><input class="ib-cell" style="min-width:0;width:100%;font-size:12px" placeholder="Nombre de empresa" value="{{ sh.empresa }}" sc-camel-on-change="{{ sh.onEmpresa }}"></sc-if>
                <textarea class="ib-cell" rows="2" style="width:100%;min-width:0;font-size:11.5px;line-height:1.45;resize:vertical;min-height:36px;max-height:110px" placeholder="Actividades y responsabilidades" value="{{ sh.actividades }}" sc-camel-on-change="{{ sh.onActividades }}"></textarea>
                <button sc-camel-on-click="{{ sh.onRemove }}" class="ib-del-btn" title="Eliminar stakeholder" style="width:28px;height:28px;border-radius:7px;border:none;background:none;color:#B23B3B;cursor:pointer">×</button>
              </div>
            </sc-for>
          </sc-if>
          <sc-if value="{{ sel.stakeholdersEmpty }}" hint-placeholder-val="{{ false }}"><div style="padding:18px;text-align:center;color:#A0AAB4;font-size:12px;border:1px dashed #D6DCE2;border-radius:10px">Aún no has agregado stakeholders.</div></sc-if>
          </div>
        </div>

      </div>

      <div style="background:#fff;border:1px solid #E6EAEE;border-radius:16px;padding:20px 22px;box-shadow:0 4px 20px rgba(0,0,0,.04)">
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap"><span style="font-size:14px;font-weight:600">Cronograma del proyecto</span><div style="display:flex;gap:14px;font-size:11.5px;color:#6B7684"><span style="display:inline-flex;align-items:center;gap:5px"><span style="width:11px;height:11px;border-radius:3px;background:{{ sel.roadmapProjectColor }}"></span>{{ sel.estado }}</span><span style="display:inline-flex;align-items:center;gap:5px"><span style="width:11px;height:11px;border-radius:3px;background:#9FD9B4"></span>Tarea</span><span style="display:inline-flex;align-items:center;gap:5px"><span style="width:2px;height:13px;background:#0039A6"></span>Hoy</span></div><span style="flex:1"></span><button sc-camel-on-click="{{ sel.editProject }}" style="background:#F1F3F5;color:#3A4756;border:none;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:600;cursor:pointer">Editar tareas</button></div>
        <div style="overflow-x:auto;border:1px solid #EEF0F2;border-radius:12px"><div style="min-width:1000px"><div style="display:flex;border-bottom:1px solid #F0F2F4;background:#FAFBFC"><div style="width:280px;min-width:280px;padding:10px 14px;font-size:11px;font-weight:600;color:#8A95A1">Proyecto / tarea</div><div style="flex:1;position:relative;display:flex"><sc-for list="{{ sel.roadmapMonths }}" as="m" hint-placeholder-count="12"><div style="{{ m.headerStyle }}">{{ m.label }}</div></sc-for></div></div><div style="position:relative"><sc-for list="{{ sel.roadmapGanttRows }}" as="r" hint-placeholder-count="5"><sc-if value="{{ r.isProj }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;border-bottom:1px solid #F5F6F8"><div style="width:280px;min-width:280px;padding:8px 14px;display:flex;align-items:center;gap:8px"><span style="{{ r.estDotStyle }}"></span><span style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.nombre }}</span><span style="flex:1"></span><span style="{{ r.avatarStyle }}">{{ r.initials }}</span></div><div style="flex:1;position:relative;height:38px"><sc-for list="{{ sel.roadmapMonths }}" as="m" hint-placeholder-count="12"><div style="{{ m.gridStyle }}"></div></sc-for><div style="{{ r.barStyle }}"><div style="{{ r.fillStyle }}"></div><span style="{{ r.labelStyle }}">{{ r.avance }}%</span></div></div></div></sc-if><sc-if value="{{ r.isTask }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;border-bottom:1px solid #F7F8FA;background:#FCFDFD"><div style="width:280px;min-width:280px;padding:6px 14px 6px 38px;display:flex;align-items:center;gap:7px"><span style="width:5px;height:5px;border-radius:50%;background:#B4BEC8"></span><span style="font-size:12px;color:#4A5763;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.nombre }}</span><span style="flex:1"></span><span style="font-size:10.5px;color:#A0AAB4;font-weight:600">{{ r.pesoLabel }}</span></div><div style="flex:1;position:relative;height:28px"><sc-for list="{{ sel.roadmapMonths }}" as="m" hint-placeholder-count="12"><div style="{{ m.gridStyle }}"></div></sc-for><div style="{{ r.barStyle }}"><div style="{{ r.fillStyle }}"></div><div style="{{ r.markStyle }}"></div></div></div></div></sc-if></sc-for><div style="{{ sel.roadmapTodayStyle }}"><div style="position:absolute;top:-1px;left:-4px;width:9px;height:9px;border-radius:50%;background:#0039A6"></div></div></div></div></div>
      </div>

t um = isNaN(UM) ? 2 : UM;\n\n    const identMap = this.computeIdentificadores(st.projects);\n    const all = this.getScopedProjects(st).map((p) => {\n      const t = this.TEAM[p.asignado] || { initials:'?', color:'#999' };\n      const e = this.ESTADOS[p.estado] || this.ESTADOS['En backlog'];\n      const cx = this.CX[p.complejidad] || this.CX['Media'];\n      const a = this.agg(p);\n      const light = a.ev > 45 || p.estado==='Completado';\n      const horasDisp = this.state.teamHours?.[p.asignado] ?? 35;\n      const capDemandHoras = this.demandaCapacidad(p);\n      const capDemand = horasDisp ? Math.round(capDemandHoras / horasDisp * 100) : 0;\n      const scoreVal = this.normScore(p.score);\n      const scoreBg = scoreVal>=5 ? '#C3EAD1' : scoreVal===4 ? '#D9F2E1' : '#EAF9EC';\n\n      const svt = a.nTasks ? this.svTone(a.sv, um) : { bg:'#F1F3F5', fg:'#A0AAB4' };\n\n      return { ...p, avance:a.ev, esp:a.pv, sv:a.sv, nTasks:a.nTasks, pesoOk:a.pesoOk, totalPeso:Math.round(a.totalPeso),\n        solicitante: p.solicitante || 'Otros',\n        identificador: identMap[p.id] || '',\n        descripcion: p.descripcion || '',\n        initials:t.initials,\n        score: scoreVal,\n        capDemand, capDemandHoras,\n        capTitle: p.estado==='En proceso'\n          ? `Demanda de capacidad: ${capDemandHoras}h de ${horasDisp}h semanales de ${p.asignado} (complejidad ${p.complejidad})`\n          : 'Este proyecto no consume capacidad (no está en proceso)',\n        capChipStyle:`display:inline-flex;align-items:center;justify-content:center;min-width:40px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;background:${capDemand>0?'#E3F7EC':'#F1F3F5'};color:${capDemand>0?'#00792F':'#A0AAB4'}`,\n        scoreCellStyle:`background:${scoreBg}`,\n        open:()=>this.setState({ openId:p.id }),\n        viewDetail:()=>this.setState({ view:'detalle', selectedProjectId:p.id }),\n        caretStyle:`width:20px;height:20px;border-radius:6px;border:none;background:#F1F3F5;color:#6B7684;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none`,\n        nTasksLabel: a.nTasks ? (a.nTasks + (a.nTasks===1 ? ' tarea' : ' tareas')) : 'sin tareas',\n        pesoTitle: a.nTasks ? (a.pesoOk ? 'Pesos suman 100%' : `Pesos suman ${Math.round(a.totalPeso)}% (ajusta a 100%)`) : 'Agrega tareas y pesos',\n        tasksBadgeStyle:`border:none;cursor:pointer;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;flex:none;background:${a.nTasks ? (a.pesoOk?'#EEF4F0':'#FBEEDD') : '#F1F3F5'};color:${a.nTasks ? (a.pesoOk?'#4A5A50':'#8A4B12') : '#8A95A1'}`,\n        svText: a.nTasks ? this.svText(a.sv) : '—',\n        svTitle: a.nTasks ? `Avance real ${a.ev}% − planificado hoy ${a.pv}% = ${this.svText(a.sv)}` : 'Sin tareas cargadas',\n        svChipStyle:`display:inline-flex;align-items:center;justify-content:center;min-width:52px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;background:${svt.bg};color:${svt.fg}`,\n        // Punto rojo intermitente: sólo cuando hay tareas y el SV cae en la zona roja más\n        // severa de svTone() (sv < -10). \"Se enciende y apaga\" vía @keyframes ibglow.\n        svAlertDotStyle: (a.nTasks && a.sv < -10)\n          ? 'display:inline-block;width:8px;height:8px;border-radius:50%;background:#B23B3B;flex:none;animation:ibglow 1.1s ease-in-out infinite'\n          : 'display:none',\n        avanceBarStyle:`height:100%;width:${a.ev}%;background:#05BE50`,\n        espMarkerStyle:`position:absolute;top:-3px;bottom:-3px;left:${a.pv}%;width:2px;background:#1B2733;opacity:.55;z-index:2`,\n        espMarkerTitle:`Avance planificado hoy: ${a.pv}%`,\n        estBarColor:e.bar,\n        estDotStyle:`width:8px;height:8px;border-radius:50%;flex:none;background:${e.dot}`,\n        estPillStyle:`display:inline-flex;align-items:center;gap:6px;background:${e.bg};color:${e.fg};padding:3px 6px 3px 9px;border-radius:999px`,\n        avatarStyle:`width:24px;height:24px;border-radius:50%;flex:none;background:${t.color};color:#fff;font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center`,\n        avatarSmStyle:`width:22px;height:22px;border-radius:50%;flex:none;background:${t.color};color:#fff;font-size:9.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center`,\n        cxPillStyle:`display:inline-flex;background:${cx.bg};color:${cx.fg};border-radius:999px`,\n        avanceFillStyle:`position:absolute;left:0;top:0;height:100%;width:${a.ev}%;background:rgba(255,255,255,.28)`,\n        barLabelStyle:`position:relative;z-index:1;font-size:10px;font-weight:600;padding:0 7px;white-space:nowrap;color:${light?'#fff':'#3A4756'}`,\n        barTitle:`${p.nombre} · ${p.inicio} → ${p.fin} · ${a.ev}%`,\n        onName:ev=>this.update(p.id,{nombre:ev.target.value}),\n        onDescripcion:ev=>this.update(p.id,{descripcion:ev.target.value}),\n        onPeriodo:ev=>this.update(p.id,{periodo:ev.target.value}),\n        onEstado:ev=>this.update(p.id,{estado:ev.target.value}),\n        onAsignado:ev=>this.update(p.id,{asignado:ev.target.value}),\n        onSolicitante:ev=>this.update(p.id,{solicitante:ev.target.value}),\n        onComplejidad:ev=>this.update(p.id,{complejidad:ev.target.value}),\n        onScore:ev=>this.update(p.id,{score:this.normScore(ev.target.value)}),\n        onInicio:ev=>this.update(p.id,{inicio:ev.target.value}),\n        onFin:ev=>this.update(p.id,{fin:ev.target.value}),\n        onFechaSolicitud:ev=>this.update(p.id,{fechaSolicitud:ev.target.value}),\n        onFinReal:ev=>this.update(p.id,{finReal:ev.target.value}),\n        del:()=>this.delProject(p.id, p.nombre),\n      };\n    });\n\n    const ORDER = { 'En proceso':0, 'En Hold':1, 'Completado':2, 'En backlog':3 };\n    const rows = all\n      .map((r, i) => ({ ...r, _ord: i }))\n      .filter(r =>\n        (st.fEstado.length===0   || st.fEstado.includes(r.estado)) &&\n        (st.fAsignado.length===0 || st.fAsignado.includes(r.asignado)) &&\n        (st.fPeriodo.length===0  || st.fPeriodo.includes(r.periodo)) &&\n        (!q || r.nombre.toLowerCase().includes(q))\n      )\n      .sort((a,b)=> (ORDER[a.estado]-ORDER[b.estado]) || (b.score-a.score) || (a._ord-b._ord))\n      .map((r,i)=>({ ...r, idx:i+1 }));\n\n    const gr = st.ganttRange || this.ganttRangeFor(all);\n    const gMinD = new Date(gr.lo), gMaxD = new Date(gr.hi);\n    const gStartY = gMinD.getUTCFullYear(), gStartM = gMinD.getUTCMonth();\n    const gEndY = gMaxD.getUTCFullYear(), gEndM = gMaxD.getUTCMonth();\n    const monthCount = Math.max(1, (gEndY*12+gEndM) - (gStartY*12+gStartM) + 1);\n    const gRangeStart = Date.UTC(gStartY, gStartM, 1);\n    const gRange = { start: gRangeStart, span: Date.UTC(gStartY, gStartM+monthCount, 1) - gRangeStart };\n    const geoIn = (a,b) => this.geo(gRange, a, b);\n    const months = Array.from({ length: monthCount }, (_,i)=>{\n      const y = gStartY + Math.floor((gStartM+i)/12), m = (gStartM+i)%12;\n      return { label: this.MONTHS[m] + (gStartY!==gEndY ? \" '\"+String(y).slice(2) : ''), gridStyle:`position:absolute;top:0;bottom:0;left:${i/monthCount*100}%;width:${100/monthCount}%;border-left:1px solid #F2F4F6` };\n    });\n\n    const ganttRows = [];\n    rows.forEach(r => {\n      const expanded = !!st.ganttExp[r.id];\n      const rg = geoIn(r.inicio, r.fin);\n      ganttRows.push({ isProj:true, isTask:false, id:r.id,\n        nombre:r.nombre, estDotStyle:r.estDotStyle, avatarSmStyle:r.avatarSmStyle, initials:r.initials,\n        barStyle:`position:absolute;top:9px;height:20px;left:${rg.left}%;width:${rg.width}%;background:${r.estBarColor};border-radius:7px;display:flex;align-items:center;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12)`,\n        avanceFillStyle:r.avanceFillStyle, barLabelStyle:r.barLabelStyle, avance:r.avance, barTitle:r.barTitle,\n        espMarkerStyle:r.espMarkerStyle, espMarkerTitle:r.espMarkerTitle,\n        capDemand:r.capDemand, capChipStyle:r.capChipStyle, capTitle:r.capTitle,\n        toggle:()=>this.toggleGantt(r.id),\n        viewDetail:()=>this.setState({ view:'detalle', selectedProjectId:r.id }),\n        caretStyle:`width:18px;height:18px;border:none;background:none;color:#8A95A1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0;transition:transform .12s${expanded?';transform:rotate(90deg)':''}${r.nTasks?'':';visibility:hidden'}`,\n      });\n      if (expanded) {\n        (r.tareas||[]).forEach(t => {\n          const g = geoIn(t.inicio, t.fin);\n          const planned = Math.round(this.taskPlanned(t));\n          ganttRows.push({ isProj:false, isTask:true, id:r.id+'-'+t.id,\n            nombre:t.nombre, pesoLabel:(Number(t.peso)||0)+'%',\n            tBarStyle:`position:absolute;top:7px;height:14px;left:${g.left}%;width:${g.width}%;background:#9FD9B4;border-radius:6px;overflow:hidden`,\n            tFillStyle:`position:absolute;left:0;top:0;height:100%;width:${t.avance}%;background:#05BE50`,\n            tMarkStyle:`position:absolute;top:0;bottom:0;left:${planned}%;width:2px;background:#1B2733;opacity:.55`,\n            tTitle:`${t.nombre} · ${t.avance}% (planificado ${planned}%)`,\n          });\n        });\n      }\n    });\n    const tg = geoIn(this.props.fechaHoy||'2026-07-31', this.props.fechaHoy||'2026-07-31');\n    const gnw = st.ganttNameColWidth;\n    const todayStyle = `position:absolute;top:0;bottom:0;left:calc(${gnw}px + (100% - ${gnw}px) * ${tg.left/100});width:2px;background:#0039A6;opacity:.55;z-index:3;pointer-events:none`;\n    const anyExp = all.some(r => st.ganttExp[r.id]);\n\n    const n = all.length;\n    const nD = rows.length;\n    const cnt = k => rows.filter(p=>p.estado===k).length;\n    const avg = arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b.avance,0)/arr.length) : 0;\n    const retrasados = rows.filter(r => r.nTasks && r.estado!=='Completado' && r.sv < -um).length;\n    const withT = rows.filter(r => r.nTasks > 0);\n    const portSV = withT.length ? Math.round(withT.reduce((a,r)=>a+r.sv,0)/withT.length) : 0;\n    const portTone = this.svTone(portSV, um);\n\n    const capPeople = st.fAsignado.length ? st.fAsignado : Object.keys(this.TEAM);\n    const capUsedList = capPeople.map(name=>{ const c=this.personCapacity(name, all); const tc=this.personTaskCapacity(name); return c.pct + tc.pct; }).filter(u=>u>0);\n    const capAvg = capUsedList.length ? Math.round(capUsedList.reduce((a,b)=>a+b,0)/capUsedList.length) : null;\n\n    // 4 tarjetas de conteo, agrupadas en 2 columnas de 2 filas: Completados/En proceso\n    // a la izquierda, Proyectos totales/Retrasados a la derecha. Al costado van los 3\n    // indicadores clave (SV%, Capacidad promedio, Avance promedio) en kpisMain + capGauge.\n    const kpisCol1 = [\n      { label:'Completados', value:cnt('Completado'), suffix:'', hint:'cerrados este año', color:'color:#005F1E' },\n      { label:'En proceso', value:cnt('En proceso'), suffix:'', hint:'activos actualmente', color:'color:#05BE50' },\n    ];\n    const kpisCol2 = [\n      { label:'Proyectos totales', value:nD, suffix:'', hint:'en el planificador 2026', color:'color:#1B2733' },\n      { label:'Retrasados', value:retrasados, suffix:'', hint:`SV por debajo de −${um} pp`, color:'color:#B5641A' },\n    ];\n    const kpisMain = [\n      { label:'SV% portafolio', value:this.svText(portSV), suffix:'', hint:'adelanto/retraso ponderado', color:`color:${portTone.fg}` },\n      { label:'Avance promedio', value:avg(rows.filter(r=>r.estado==='En proceso')), suffix:'%', hint:'proyectos en proceso', color:'color:#0039A6' },\n    ];\n\n    // Velocímetro de capacidad promedio: zonas 0-20% roja (muy baja, casi sin proyectos\n    // activos), 20-40% ámbar (baja), 40-80% verde (saludable, incluye el objetivo ~60%),\n    // 80-100% roja (sobre-capacidad). La aguja apunta según capAvg sobre un se
